{% extends 'accounts/base.html' %}

{% block content %}
    <h2>Mark Student Attendance</h2>
    <p style="color: #555;">Fill out the form below to log attendance:</p>

    <form method="post" style="margin-top: 1.5rem; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-big" style="font-size: 1rem; padding: 0.75rem 1.5rem; width: 100%;">Save Attendance</button>
    </form>

    <div style="margin-top: 2rem;">
        <a href="{% url 'attendance_list' %}" style="color: #2563eb; text-decoration: none; font-weight: bold;">View Attendance Records</a>
    </div>
{% endblock %}

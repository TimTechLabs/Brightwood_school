<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightwood School - Elite Education</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* Header Navigation */
        header {
            width: 100%;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b0f19;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
        }

        .menu-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero Section */
        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(2rem, 5vw, 4rem) 1rem;
            background: radial-gradient(circle at center, #1e3a8a 0%, #0b0f19 70%);
            width: 100%;
        }

        /* Gold Pill Badge Fix */
        .badge {
            display: inline-block;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 0.4rem 0.85rem;
            border-radius: 50px;
            font-size: clamp(0.65rem, 2vw, 0.8rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0 auto 1.75rem auto;
            max-width: calc(100% - 2rem);
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.3;
        }

        /* Responsive Hero Headline */
        .hero h2 {
            font-size: clamp(1.6rem, 5.5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.2;
            margin: 0 0 1.25rem 0;
            max-width: 850px;
            width: 100%;
        }

        .hero h2 .highlight {
            color: #f59e0b;
            display: block;
            margin-top: 0.25rem;
        }

        /* Description Paragraph */
        .hero p {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: #cbd5e1;
            max-width: 600px;
            line-height: 1.5;
            margin: 0 auto 2rem auto;
            width: 100%;
        }

        /* Mobile specific spacing */
        @media (max-width: 480px) {
            header {
                padding: 0.85rem 1rem;
            }

            .hero {
                padding: 1.5rem 0.85rem;
            }

            .badge {
                padding: 0.35rem 0.75rem;
                letter-spacing: 0px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Brightwood School</h1>
        <button class="menu-toggle" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <section class="hero">
        <div class="badge">
            Established for Leadership &amp; Excellence
        </div>

        <h2>
            Shaping Character, Inspiring Minds,
            <span class="highlight">Defining the Future</span>
        </h2>

        <p>
            Welcome to Brightwood School. We merge timeless moral values with advanced digital learning to build confident, visionary leaders.
        </p>
    </section>

</body>
</html>
